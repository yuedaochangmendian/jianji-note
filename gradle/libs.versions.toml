[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.8"
coreKtx = "1.18.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.1"
recyclerview = "1.3.0"
lifecycle = "2.10.0"
activity = "1.13.0"
coroutines = "1.11.0"
room = "2.7.1"
documentfile = "1.0.0"
junit = "4.13.2"
